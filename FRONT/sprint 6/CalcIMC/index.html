<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Calculadora de IMC</title>
</head>
<body>
    <main id="container">
        <section id="img">
            <img src="undraw_personal-trainer_bqkg.svg">
        </section>

        <section id="calculator">
            <form id="form">
                <h1 id="title">
                    Calculadora - IMC
                </h1>
                <div class="input-box">
                    <label for="weight">
                        Peso em kg
                    </label>
                    <div class="input-field">
                        <input type="number" id="weight" step="0.01" required></input>
                        <i class="fa-solid fa-weight-hanging"></i>
                        <span>
                            kg
                        </span>
                    </div>
 
                    <label for="height">
                        Altura em m
                    </label>                    
                    <div class="input-field">
                        <input type="number" id="height" step="0.01" required></input>
                        <i class="fa-solid fa-ruler"></i>
                        <span>
                            m
                        </span>
                    </div>
                </div>
                <button id="calculate">
                    Calcular
                </button>

            </form>
            <div id="infos" class="hidden">
                <div id="result">
                    <div id="bmi">
                        <span id="value"></span>
                        <span>Seu IMC</span>
                    </div>
                    <div id="description">
                        <span></span>
                    </div>
                </div> 
                <div id="more-info">
                    <a href="https://vencerocancer.org.br/saude/imc-calculadora-e-guia-completo/?gad_source=1&gad_campaignid=22596549316&gclid=CjwKCAiA9aPKBhBhEiwAyz82J49e4tdTKM5dDXoCJq_DL57_dJW5l_P9TlztR6DsSFAFeVdavofwTBoCMigQAvD_BwE">
                        Para mais informações, acesse o link
                        <i class="fa-solid fa-link"></i>
                    </a >
                </div>
            </div>
        </section>
    </main>
<script src="script.js"></script>
</body>
</html>
